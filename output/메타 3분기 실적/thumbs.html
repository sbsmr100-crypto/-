<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../../tools/thumb_base.css"></head><body>

<template id="bg1svg">
<svg class="bg" viewBox="0 0 1080 1080">
  <defs><linearGradient id="g1" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#021a4a"/><stop offset="1" stop-color="#0857d8"/></linearGradient></defs>
  <rect width="1080" height="1080" fill="url(#g1)"/>
  <g stroke="#fff" stroke-opacity=".08" stroke-width="2"><line x1="0" y1="700" x2="1080" y2="700"/><line x1="0" y1="840" x2="1080" y2="840"/><line x1="0" y1="980" x2="1080" y2="980"/></g>
  <!-- 성장 막대 -->
  <g fill="#fff"><rect x="560" y="820" width="90" height="200" rx="10" fill-opacity=".25"/><rect x="680" y="740" width="90" height="280" rx="10" fill-opacity=".35"/><rect x="800" y="640" width="90" height="380" rx="10" fill-opacity=".5"/><rect x="920" y="520" width="90" height="500" rx="10" fill="#ffd43b"/></g>
  <polyline points="560,760 700,690 820,580 960,440" fill="none" stroke="#ffd43b" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
  <polygon points="985,410 975,480 920,440" fill="#ffd43b"/>
  <!-- 무한대 루프 모티프 -->
  <path d="M200 900 C 120 820, 120 980, 200 900 C 280 820, 280 980, 200 900" transform="translate(-60,-40) scale(1.2)" fill="none" stroke="#fff" stroke-opacity=".15" stroke-width="20"/>
</svg></template>

<template id="bg2svg">
<svg class="bg" viewBox="0 0 1080 1080">
  <rect width="1080" height="1080" fill="#f4f5f7"/>
  <rect x="0" y="700" width="1080" height="380" fill="#ffe3e3"/>
  <!-- 들어온 돈 vs 나간 돈 수위 -->
  <g transform="translate(640,170)">
    <rect x="0" y="0" width="160" height="440" rx="20" fill="#dee2e6"/><rect x="0" y="40" width="160" height="400" rx="20" fill="#51cf66"/>
    <rect x="200" y="0" width="160" height="440" rx="20" fill="#dee2e6"/><rect x="200" y="0" width="160" height="440" rx="20" fill="#ff922b"/>
  </g>
  <!-- 새는 동전 -->
  <g fill="#e03131"><circle cx="760" cy="820" r="38"/><circle cx="860" cy="900" r="30" fill-opacity=".7"/><circle cx="700" cy="960" r="24" fill-opacity=".5"/></g>
  <path d="M600 660 L1000 660" stroke="#111" stroke-width="6" stroke-dasharray="20 14"/>
</svg></template>

<template id="bg3svg">
<svg class="bg" viewBox="0 0 1080 1080">
  <defs><radialGradient id="orb" cx=".72" cy=".62" r=".6"><stop offset="0" stop-color="#9775fa"/><stop offset=".35" stop-color="#5f3dc4"/><stop offset="1" stop-color="#0d0624"/></radialGradient></defs>
  <rect width="1080" height="1080" fill="url(#orb)"/>
  <g stroke="#d0bfff" stroke-opacity=".35" stroke-width="3">
    <line x1="780" y1="670" x2="560" y2="520"/><line x1="780" y1="670" x2="980" y2="460"/><line x1="780" y1="670" x2="1000" y2="880"/><line x1="780" y1="670" x2="560" y2="900"/><line x1="560" y1="520" x2="980" y2="460"/><line x1="560" y1="900" x2="1000" y2="880"/>
  </g>
  <g fill="#e5dbff"><circle cx="560" cy="520" r="16"/><circle cx="980" cy="460" r="16"/><circle cx="1000" cy="880" r="16"/><circle cx="560" cy="900" r="16"/></g>
  <circle cx="780" cy="670" r="110" fill="#fff" fill-opacity=".12"/><circle cx="780" cy="670" r="60" fill="#fff" fill-opacity=".85"/>
  <!-- 쇼핑백 -->
  <g transform="translate(880,560)"><path d="M28 30 V18 a17 17 0 0 1 34 0 V30" fill="none" stroke="#ffd43b" stroke-width="7"/><polygon points="0,30 90,30 100,130 -10,130" fill="#ffd43b"/><circle cx="28" cy="50" r="6" fill="#5f3dc4"/><circle cx="62" cy="50" r="6" fill="#5f3dc4"/></g>
</svg></template>

<div class="canvas" data-out="bg1.png" id="b1"></div>
<div class="canvas" data-out="bg2.png" id="b2"></div>
<div class="canvas" data-out="bg3.png" id="b3"></div>

<div class="canvas" data-out="thumb1.png" id="t1">
  <div class="copy" style="top:120px;color:#fff">
    <div class="sub" style="font-size:52px;color:#a5d8ff">메타 3분기 진짜 엔진</div>
    <div class="headline" style="font-size:140px;margin-top:10px;white-space:nowrap">광고 단가<br><span style="color:#ffd43b">+14%</span></div>
  </div>
  <div class="copy" style="top:620px;right:auto"><span class="tag" style="background:#ffd43b;color:#021a4a;font-size:46px">사용자 +3%로 매출 +26%</span></div>
</div>

<div class="canvas" data-out="thumb2.png" id="t2" data-wm="dark">
  <div class="copy" style="top:140px;right:480px;color:#111">
    <span class="tag" style="background:#111;color:#fff">메타 3분기</span>
    <div class="headline" style="font-size:132px;margin-top:30px;white-space:nowrap">현금이<br><span class="hl" style="background:#e03131;color:#fff">말랐다?</span></div>
  </div>
  <div class="copy" style="bottom:110px;right:auto"><span class="tag" style="background:#111;color:#fff">번 돈 328억 &lt; 쓴 돈 349억</span></div>
</div>

<div class="canvas" data-out="thumb3.png" id="t3">
  <div class="copy" style="top:130px;color:#fff">
    <div class="sub" style="font-size:52px;color:#d0bfff">1,450억 달러 베팅</div>
    <div class="headline" style="font-size:140px;margin-top:10px;white-space:nowrap">AI에<br><span style="color:#ffd43b">올인</span>했다</div>
  </div>
  <div class="copy" style="top:700px;right:auto"><span class="tag" style="background:#fff;color:#5f3dc4;font-size:46px">MUSE 6주 만에 1,000만 명</span></div>
</div>

<script>
const put=(id,tpl)=>document.getElementById(id).insertAdjacentHTML('afterbegin',document.getElementById(tpl).innerHTML);
put('b1','bg1svg');put('b2','bg2svg');put('b3','bg3svg');
put('t1','bg1svg');put('t2','bg2svg');put('t3','bg3svg');
</script>
<script src="../../tools/watermark.js"></script>
</body></html>
