<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../../tools/thumb_base.css">
<link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet"></head><body>

<template id="bg1svg">
<svg class="bg" viewBox="0 0 1080 1080">
  <rect width="1080" height="1080" fill="#fff4e8"/>
  <circle cx="860" cy="860" r="320" fill="#ffe8cc"/>
  <g transform="translate(640,560)"><polygon points="190,0 380,170 0,170" fill="#e8590c"/><rect x="40" y="170" width="300" height="250" rx="18" fill="#ff922b"/><rect x="150" y="270" width="80" height="150" rx="10" fill="#fff4e8"/><rect x="70" y="210" width="60" height="50" rx="8" fill="#fff4e8"/><rect x="250" y="210" width="60" height="50" rx="8" fill="#fff4e8"/></g>
</svg></template>

<template id="bg2svg">
<svg class="bg" viewBox="0 0 1080 1080">
  <rect width="1080" height="1080" fill="#f3f0ff"/>
  <!-- 저울: 집 vs 통장 -->
  <g transform="translate(560,600)">
    <rect x="215" y="0" width="16" height="380" fill="#3b3355"/><rect x="120" y="370" width="210" height="24" rx="10" fill="#3b3355"/>
    <g transform="rotate(-10 223 20)"><rect x="0" y="12" width="446" height="14" rx="7" fill="#3b3355"/>
      <polygon points="40,-90 110,-40 -30,-40" fill="#ff922b"/><rect x="-15" y="-40" width="110" height="52" rx="6" fill="#ffa94d"/>
      <rect x="350" y="-60" width="100" height="72" rx="12" fill="#7950f2"/><rect x="365" y="-35" width="70" height="10" rx="5" fill="#fff"/></g>
  </g>
</svg></template>

<template id="bg3svg">
<svg class="bg" viewBox="0 0 1080 1080">
  <rect width="1080" height="1080" fill="#ebfbee"/>
  <!-- 집 + 위로 솟는 화살표 -->
  <g transform="translate(620,600)"><polygon points="170,0 340,150 0,150" fill="#2b8a3e"/><rect x="35" y="150" width="270" height="230" rx="16" fill="#40c057"/><rect x="135" y="250" width="70" height="130" rx="8" fill="#ebfbee"/></g>
  <g fill="#2b8a3e"><rect x="960" y="380" width="26" height="200" rx="13"/><polygon points="973,320 1020,400 926,400"/></g>
</svg></template>

<div class="canvas" data-out="bg1.png" id="b1"></div>
<div class="canvas" data-out="bg2.png" id="b2"></div>
<div class="canvas" data-out="bg3.png" id="b3"></div>

<!-- 숫자형 -->
<div class="canvas" data-out="thumb1.png" id="t1" data-wm="dark">
  <div class="copy" style="top:120px;right:auto;color:#3b3355">
    <div style="font:400 54px 'Jua';color:#e8590c">재산공개 1위의 속사정</div>
    <div style="font:400 170px/1.08 'Jua';margin-top:16px;white-space:nowrap">부동산<br><span style="color:#e8590c">73%</span></div>
  </div>
  <div class="copy" style="top:640px;right:auto"><span class="tag" style="background:#3b3355;color:#fff;font:400 44px 'Jua'">분양권이 42억</span></div>
</div>

<!-- 질문·반전형 -->
<div class="canvas" data-out="thumb2.png" id="t2" data-wm="dark">
  <div class="copy" style="top:120px;right:auto;color:#3b3355">
    <div style="font:400 54px 'Jua';color:#7950f2">고위공직자 재산 1·2위</div>
    <div style="font:400 150px/1.1 'Jua';margin-top:16px;white-space:nowrap">집이냐<br><span style="color:#7950f2">통장이냐</span></div>
  </div>
</div>

<!-- 감정·상황형 -->
<div class="canvas" data-out="thumb3.png" id="t3" data-wm="dark">
  <div class="copy" style="top:120px;right:auto;color:#1e4d2b">
    <div style="font:400 54px 'Jua';color:#2b8a3e">재산공개 '증가'의 함정</div>
    <div style="font:400 140px/1.12 'Jua';margin-top:16px;white-space:nowrap">안 샀는데<br><span style="color:#2b8a3e">늘었다</span></div>
  </div>
  <div class="copy" style="top:620px;right:auto"><span class="tag" style="background:#2b8a3e;color:#fff;font:400 44px 'Jua'">공시가 +4.7억</span></div>
</div>

<script>
const put=(id,tpl)=>document.getElementById(id).insertAdjacentHTML('afterbegin',document.getElementById(tpl).innerHTML);
put('b1','bg1svg');put('b2','bg2svg');put('b3','bg3svg');
put('t1','bg1svg');put('t2','bg2svg');put('t3','bg3svg');
</script>
<script src="../../tools/watermark.js"></script>
</body></html>
