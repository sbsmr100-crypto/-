<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../../tools/thumb_base.css"></head><body>

<!-- 공통 연설자 실루엣 (실존 인물 묘사 아님) -->
<template id="speaker">
  <circle cx="0" cy="-330" r="78"/>
  <path d="M-160 -60 Q-150 -230 0 -235 Q150 -230 160 -60 L170 120 L-170 120 Z"/>
</template>

<template id="bg1svg">
<svg class="bg" viewBox="0 0 1080 1080">
  <defs>
    <radialGradient id="spot" cx=".72" cy=".2" r=".75"><stop offset="0" stop-color="#1f4f86"/><stop offset=".55" stop-color="#0b1a2e"/><stop offset="1" stop-color="#05080f"/></radialGradient>
    <linearGradient id="beam" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#9fd0ff" stop-opacity=".35"/><stop offset="1" stop-color="#9fd0ff" stop-opacity="0"/></linearGradient>
  </defs>
  <rect width="1080" height="1080" fill="url(#spot)"/>
  <polygon points="700,0 900,0 1080,1080 520,1080" fill="url(#beam)"/>
  <g transform="translate(800,760)" fill="#02050a"><circle cx="0" cy="-330" r="78"/><path d="M-160 -60 Q-150 -230 0 -235 Q150 -230 160 -60 L170 320 L-170 320 Z"/>
    <path d="M110 -150 Q190 -230 170 -330" stroke="#02050a" stroke-width="44" fill="none" stroke-linecap="round"/></g>
  <!-- 연단 -->
  <path d="M600 820 L1000 820 L960 1080 L640 1080 Z" fill="#0f2a4a"/>
  <rect x="600" y="810" width="400" height="26" rx="6" fill="#1d4e85"/>
  <line x1="760" y1="810" x2="730" y2="690" stroke="#3a3a3a" stroke-width="8"/><ellipse cx="728" cy="684" rx="14" ry="20" fill="#555"/>
  <g fill="#fff" fill-opacity=".08"><circle cx="120" cy="1040" r="60"/><circle cx="260" cy="1060" r="56"/><circle cx="400" cy="1045" r="60"/></g>
</svg></template>

<template id="bg2svg">
<svg class="bg" viewBox="0 0 1080 1080">
  <rect width="1080" height="1080" fill="#eef4fb"/>
  <!-- 대형 스크린 -->
  <rect x="80" y="560" width="560" height="360" rx="20" fill="#0b2545"/>
  <g fill="#3a96f0"><rect x="150" y="780" width="70" height="90" rx="6"/><rect x="250" y="740" width="70" height="130" rx="6"/><rect x="350" y="690" width="70" height="180" rx="6"/><rect x="450" y="620" width="70" height="250" rx="6" fill="#7cc4ff"/></g>
  <polyline points="160,760 285,715 385,660 495,590" fill="none" stroke="#ffb900" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- 핸드마이크 든 연설자 -->
  <g transform="translate(860,890)" fill="#13294b"><circle cx="0" cy="-330" r="78"/><path d="M-160 -60 Q-150 -230 0 -235 Q150 -230 160 -60 L170 260 L-170 260 Z"/>
    <path d="M-120 -140 Q-200 -230 -150 -330" stroke="#13294b" stroke-width="46" fill="none" stroke-linecap="round"/></g>
  <rect x="-172" y="-380" width="26" height="70" rx="10" transform="translate(860,890) rotate(-15)" fill="#444"/>
  <rect x="0" y="985" width="1080" height="95" fill="#d7e5f5"/>
</svg></template>

<template id="bg3svg">
<svg class="bg" viewBox="0 0 1080 1080">
  <defs><linearGradient id="g3" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#101418"/><stop offset="1" stop-color="#1e2a24"/></linearGradient></defs>
  <rect width="1080" height="1080" fill="url(#g3)"/>
  <!-- 뒤쪽 스크린 빛 (장식) -->
  <rect x="560" y="60" width="460" height="300" rx="18" fill="#2a3a46" opacity=".55"/>
  <g stroke="#7fdc5a" stroke-opacity=".5" stroke-width="6" fill="none"><circle cx="790" cy="210" r="60"/><circle cx="790" cy="210" r="110" stroke-opacity=".25"/></g>
  <g transform="translate(790,800)" fill="#000"><circle cx="0" cy="-330" r="78"/><path d="M-160 -60 Q-150 -230 0 -235 Q150 -230 160 -60 L170 300 L-170 300 Z"/></g>
  <!-- 기자회견 마이크 여러 개 -->
  <g stroke="#666" stroke-width="7"><line x1="700" y1="1080" x2="740" y2="610"/><line x1="790" y1="1080" x2="790" y2="600"/><line x1="880" y1="1080" x2="840" y2="610"/></g>
  <g><rect x="722" y="580" width="40" height="60" rx="16" fill="#d13438"/><rect x="770" y="566" width="40" height="60" rx="16" fill="#0067b8"/><rect x="820" y="580" width="40" height="60" rx="16" fill="#107c10"/></g>
  <!-- 카메라 플래시 -->
  <g fill="#fff"><circle cx="120" cy="980" r="10" opacity=".7"/><circle cx="330" cy="1010" r="7" opacity=".5"/><circle cx="520" cy="960" r="9" opacity=".6"/></g>
</svg></template>

<div class="canvas" data-out="bg1.png" id="b1"></div>
<div class="canvas" data-out="bg2.png" id="b2"></div>
<div class="canvas" data-out="bg3.png" id="b3"></div>

<!-- 숫자형 -->
<div class="canvas" data-out="thumb1.png" id="t1">
  <div class="copy" style="top:110px;right:auto;color:#fff">
    <div class="sub" style="font-size:52px;color:#9fd0ff;white-space:nowrap">마이크로소프트 1분기 실적</div>
    <div class="headline" style="font-size:170px;margin-top:14px;white-space:nowrap;line-height:1.05">애저<br><span style="color:#4fb3ff">+48%</span></div>
  </div>
  <div class="copy" style="top:620px;right:auto;max-width:520px">
    <div style="background:#fff;color:#0b1a2e;border-radius:36px;padding:26px 34px;font:900 44px/1.3 'Noto Sans KR';position:relative">"AI를<br>실질적인 성과로"
      <div style="position:absolute;right:-30px;top:60px;width:0;height:0;border-left:44px solid #fff;border-top:22px solid transparent;border-bottom:22px solid transparent"></div></div>
    <div style="font:700 30px 'Noto Sans KR';color:#9fd0ff;margin-top:16px">사티아 나델라 CEO</div>
  </div>
</div>

<!-- 질문·반전형 -->
<div class="canvas" data-out="thumb2.png" id="t2" data-wm="dark">
  <div class="copy" style="top:100px;right:auto;color:#0b2545">
    <span class="tag" style="background:#0067b8;color:#fff">마이크로소프트 1분기</span>
    <div class="headline" style="font-size:104px;margin-top:28px;white-space:nowrap;line-height:1.15">다 넘었는데<br><span class="hl" style="background:#d13438;color:#fff">딱 하나</span> 놓쳤다?</div>
  </div>
</div>

<!-- 감정·상황형 -->
<div class="canvas" data-out="thumb3.png" id="t3">
  <div class="copy" style="top:120px;right:auto;color:#fff;max-width:600px">
    <div class="sub" style="font-size:50px;color:#ffb900;white-space:nowrap">나델라가 꺼낸 다음 카드</div>
    <div class="headline" style="font-size:132px;margin-top:16px;white-space:nowrap;line-height:1.1">AI<br><span style="color:#7fdc5a">에이전트</span></div>
  </div>
  <div class="copy" style="top:640px;right:auto;max-width:560px">
    <div style="background:#fff;color:#101418;border-radius:36px;padding:24px 32px;font:800 36px/1.4 'Noto Sans KR'">"AI 에이전트의<br>안전성과 보안으로<br>신뢰를 확보"</div>
    <div style="font:700 30px 'Noto Sans KR';color:#ffb900;margin-top:16px">사티아 나델라 CEO</div>
  </div>
</div>

<script>
const put=(id,tpl)=>document.getElementById(id).insertAdjacentHTML('afterbegin',document.getElementById(tpl).innerHTML);
put('b1','bg1svg');put('b2','bg2svg');put('b3','bg3svg');
put('t1','bg1svg');put('t2','bg2svg');put('t3','bg3svg');
</script>
<script src="../../tools/watermark.js"></script>
</body></html>
