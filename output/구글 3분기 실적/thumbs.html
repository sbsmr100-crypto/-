<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../../tools/thumb_base.css"></head><body>

<template id="bg1svg">
<svg class="bg" viewBox="0 0 1080 1080">
  <defs><radialGradient id="g1" cx=".75" cy=".8" r=".9"><stop offset="0" stop-color="#4a0b0e"/><stop offset="1" stop-color="#0b0b0d"/></radialGradient></defs>
  <rect width="1080" height="1080" fill="url(#g1)"/>
  <g stroke="#fff" stroke-opacity=".06" stroke-width="2"><line x1="0" y1="560" x2="1080" y2="560"/><line x1="0" y1="720" x2="1080" y2="720"/><line x1="0" y1="880" x2="1080" y2="880"/></g>
  <!-- 캔들: 보합 후 급락 -->
  <g stroke-width="4">
    <line x1="560" y1="500" x2="560" y2="600" stroke="#37b24d"/><rect x="540" y="520" width="40" height="60" fill="#37b24d"/>
    <line x1="640" y1="480" x2="640" y2="590" stroke="#37b24d"/><rect x="620" y="500" width="40" height="70" fill="#37b24d"/>
    <line x1="720" y1="470" x2="720" y2="570" stroke="#e03131"/><rect x="700" y="490" width="40" height="60" fill="#e03131"/>
    <line x1="800" y1="540" x2="800" y2="860" stroke="#ff2b2b"/><rect x="775" y="560" width="50" height="280" fill="#ff2b2b"/>
    <line x1="890" y1="820" x2="890" y2="960" stroke="#ff2b2b"/><rect x="865" y="840" width="50" height="100" fill="#ff2b2b"/>
  </g>
  <path d="M760 420 Q960 520 980 880" fill="none" stroke="#ff4d4d" stroke-width="16" stroke-linecap="round"/>
  <polygon points="950,880 1012,880 984,950" fill="#ff4d4d"/>
</svg></template>

<template id="bg2svg">
<svg class="bg" viewBox="0 0 1080 1080">
  <rect width="1080" height="1080" fill="#f4f5f7"/>
  <rect x="0" y="690" width="1080" height="390" fill="#fff"/>
  <!-- 왼쪽: 클라우드 막대 2배 -->
  <rect x="120" y="880" width="150" height="150" rx="14" fill="#a5c8ff"/>
  <rect x="300" y="740" width="150" height="290" rx="14" fill="#1a73e8"/>
    <!-- 오른쪽: 주가 급락 선 -->
  <polyline points="600,760 680,750 760,760 820,950 900,975" fill="none" stroke="#e03131" stroke-width="18" stroke-linecap="round" stroke-linejoin="round"/>
  <polygon points="890,945 950,985 885,1010" fill="#e03131"/>
  <line x1="540" y1="720" x2="540" y2="1040" stroke="#ced4da" stroke-width="4" stroke-dasharray="14 10"/>
</svg></template>

<template id="bg3svg">
<svg class="bg" viewBox="0 0 1080 1080">
  <defs><linearGradient id="g3" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#14141c"/><stop offset="1" stop-color="#2a0e12"/></linearGradient></defs>
  <rect width="1080" height="1080" fill="url(#g3)"/>
  <!-- 새벽 달 + 잠 못 드는 밤 -->
  <circle cx="900" cy="170" r="80" fill="#ffd43b" fill-opacity=".9"/><circle cx="935" cy="145" r="72" fill="#14141c"/>
  <g fill="#fff" fill-opacity=".5"><circle cx="760" cy="120" r="4"/><circle cx="1010" cy="300" r="3"/><circle cx="700" cy="260" r="3"/><circle cx="820" cy="330" r="4"/></g>
  <!-- 휴대폰 화면 속 하락 차트 -->
  <g transform="translate(640,560) rotate(-8)">
    <rect x="0" y="0" width="300" height="460" rx="40" fill="#222" stroke="#444" stroke-width="6"/>
    <rect x="20" y="40" width="260" height="380" rx="20" fill="#120a0b"/>
    <polyline points="40,140 90,130 140,145 180,120 210,300 260,360" fill="none" stroke="#ff4d4d" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="40" y="380" width="220" height="16" rx="8" fill="#ff4d4d" fill-opacity=".35"/>
  </g>
  <ellipse cx="790" cy="1060" rx="320" ry="60" fill="#ff4d4d" fill-opacity=".15"/>
</svg></template>

<div class="canvas" data-out="bg1.png" id="b1"></div>
<div class="canvas" data-out="bg2.png" id="b2"></div>
<div class="canvas" data-out="bg3.png" id="b3"></div>

<!-- 숫자형 -->
<div class="canvas" data-out="thumb1.png" id="t1">
  <div class="copy" style="top:120px;color:#fff">
    <div class="sub" style="font-size:54px;color:#ff8787;white-space:nowrap">구글 3분기 실적 발표 직후</div>
    <div class="headline" style="font-size:170px;margin-top:16px;white-space:nowrap;line-height:1.05">시간외<br><span style="color:#ff3b3b">-10%</span></div>
  </div>
  <div class="copy" style="top:640px;right:auto"><span class="tag" style="background:#ff3b3b;color:#fff;font-size:50px">322 → 288달러</span></div>
</div>

<!-- 질문·반전형 -->
<div class="canvas" data-out="thumb2.png" id="t2" data-wm="dark">
  <div class="copy" style="top:110px;color:#111">
    <span class="tag" style="background:#111;color:#fff">구글 3분기 실적</span>
    <div class="headline" style="font-size:118px;margin-top:30px;white-space:nowrap;line-height:1.12">클라우드 <span style="color:#1a73e8">2배</span>인데<br>주가는 왜<br><span class="hl" style="background:#e03131;color:#fff">-10%?</span></div>
  </div>
</div>

<!-- 감정·상황형 -->
<div class="canvas" data-out="thumb3.png" id="t3">
  <div class="copy" style="top:150px;right:440px;color:#fff">
    <div class="sub" style="font-size:50px;color:#ffd43b;white-space:nowrap">자고 일어났더니</div>
    <div class="headline" style="font-size:150px;margin-top:16px;white-space:nowrap;line-height:1.1">구글<br><span style="color:#ff4d4d">어닝쇼크</span></div>
  </div>
  <div class="copy" style="top:640px;right:auto"><span class="tag" style="background:#ff4d4d;color:#fff;font-size:46px">주가 급락 이유 3가지</span></div>
</div>

<script>
const put=(id,tpl)=>document.getElementById(id).insertAdjacentHTML('afterbegin',document.getElementById(tpl).innerHTML);
put('b1','bg1svg');put('b2','bg2svg');put('b3','bg3svg');
put('t1','bg1svg');put('t2','bg2svg');put('t3','bg3svg');
</script>
<script src="../../tools/watermark.js"></script>
</body></html>
