<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../../tools/thumb_base.css">
<style>
/* 네이버 클립 세로 1080×1920. UI가 덮는 하단 ~350px·우측 버튼 영역은 비워 둔다. */
.v { width:1080px; height:1920px; position:relative; overflow:hidden; box-sizing:border-box;
  font-family:'Noto Sans KR',sans-serif; letter-spacing:-0.03em; }
.bh { font-family:'Black Han Sans','Noto Sans KR',sans-serif; letter-spacing:-0.01em; }
.abs { position:absolute; }
.bgimg { position:absolute; left:0; width:1080px; height:1080px; }
.redb { background:#e5322d; color:#fff; padding:0 .14em; }
.wmv { position:absolute; right:40px; top:120px; font:900 36px 'Noto Sans KR'; letter-spacing:0; color:rgba(255,255,255,.85); }

/* ── 영상 스테이지 ── */
#stage { background:linear-gradient(180deg,#121212 0%,#1b1b1f 60%,#121212 100%); }
#stage .layer { position:absolute; inset:0; opacity:0; }
.cap { position:absolute; left:80px; right:80px; top:250px; color:#fff; font-size:92px; line-height:1.18; }
.cap .k { color:#5fa0ff; } .cap .g { color:#4ade80; } .cap .r { color:#ff6b6b; } .cap .y { color:#ffc53d; }
.figbox { position:absolute; left:90px; top:520px; width:900px; height:900px; overflow:hidden; border-radius:26px;
  box-shadow:0 30px 80px rgba(0,0,0,.6); }
.figbox img, .figbox .ring { position:absolute; left:0; top:0; transform-origin:0 0; }
.figbox img { width:1080px; height:1080px; }
.ring { border:10px solid #ffc53d; border-radius:22px; box-sizing:border-box; box-shadow:0 0 0 9999px rgba(0,0,0,.28); }
.sub { position:absolute; left:60px; right:60px; top:1470px; text-align:center; }
.sub span { display:inline-block; background:rgba(0,0,0,.75); color:#fff; font:700 50px/1.35 'Noto Sans KR';
  padding:14px 30px; border-radius:16px; }
.sub b { color:#ffc53d; }
#bar { position:absolute; left:0; top:0; height:10px; background:#ff5a5a; z-index:5; }
</style></head><body>

<!-- 훅 배경(글자 없음): 왼쪽 클라우드 2배 성장 vs 오른쪽 주가 급락 -->
<template id="gsvg">
<svg viewBox="0 0 1080 1920" style="position:absolute;inset:0;width:100%;height:100%">
  <defs>
    <linearGradient id="gsky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0b0e16"/><stop offset=".55" stop-color="#14121a"/><stop offset="1" stop-color="#2a0d10"/></linearGradient>
    <radialGradient id="gblue" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#4f8dff" stop-opacity=".4"/><stop offset="1" stop-color="#4f8dff" stop-opacity="0"/></radialGradient>
    <radialGradient id="gred" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#ff3b3b" stop-opacity=".4"/><stop offset="1" stop-color="#ff3b3b" stop-opacity="0"/></radialGradient>
    <linearGradient id="gbar" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#8ab4ff"/><stop offset="1" stop-color="#1a6ef0"/></linearGradient>

    <line x1="0" y1="1150" x2="1080" y2="1150"/><line x1="0" y1="1330" x2="1080" y2="1330"/><line x1="0" y1="1510" x2="1080" y2="1510"/><line x1="0" y1="1690" x2="1080" y2="1690"/>

  <g fill="#4f8dff" fill-opacity=".5" filter="url(#gblur)">
    <circle cx="190" cy="1330" r="85"/><circle cx="300" cy="1270" r="120"/><circle cx="410" cy="1335" r="85"/><rect x="150" y="1320" width="300" height="100"/>
  </g>
  <g fill="#1d3d78"><circle cx="190" cy="1330" r="78"/><circle cx="300" cy="1270" r="112"/><circle cx="410" cy="1335" r="78"/><rect x="150" y="1320" width="300" height="98" rx="40"/></g>
  <g fill="#ffffff" opacity=".14"><circle cx="190" cy="1330" r="78"/><circle cx="300" cy="1270" r="112"/><circle cx="410" cy="1335" r="78"/><rect x="150" y="1320" width="300" height="98" rx="40"/></g>
  <!-- 2배 막대 -->
  <rect x="150" y="1640" width="110" height="160" rx="14" fill="#8ab4ff" fill-opacity=".55"/>
  <rect x="310" y="1480" width="110" height="320" rx="14" fill="url(#gbar)"/>
  <path d="M205 1610 Q 260 1470 350 1450" fill="none" stroke="#4ade80" stroke-width="10" stroke-linecap="round"/>
  <polygon points="372,1446 336,1428 342,1470" fill="#4ade80"/>
  <line x1="540" y1="1180" x2="540" y2="1820" stroke="#ffffff" stroke-opacity=".25" stroke-width="4" stroke-dasharray="14 14"/>
  <!-- 주가 급락선 -->
  <polyline points="600,1250 680,1225 760,1240 830,1215" fill="none" stroke="#8ab4ff" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
  <polyline points="830,1215 880,1480 950,1560 1000,1700" fill="none" stroke="#ff3b3b" stroke-width="30" stroke-opacity=".35" filter="url(#gblur)"/>
  <polyline points="830,1215 880,1480 950,1560 995,1690" fill="none" stroke="#ff4d4d" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"/>
  <polygon points="1012,1745 965,1690 1028,1672" fill="#ff4d4d"/>
  <rect y="1840" width="1080" height="80" fill="#000" fill-opacity=".35"/>
</svg>
</template>

<!-- 배경 단독(bg) -->
<div class="v gbg" data-out="bg_clip.png"></div>

<!-- cover1: 질문·반전형 = 영상 첫 장면 -->
<div class="v gbg" data-out="cover1.png">

    <div class="bh" style="font-size:150px;line-height:1.15;margin-top:18px">구글 <span style="color:#ff5a5a">실적발표</span></div>

<div class="v" data-out="cover2.png" style="background:#120707">

  <div class="abs" style="left:0;right:0;top:840px;height:240px;background:linear-gradient(#120707,rgba(18,7,7,0))"></div>

    <div style="font:700 60px 'Noto Sans KR';color:#ff9b9b;margin-top:40px">시간외 주가</div>

<div class="v" data-out="cover3.png" style="background:#15121c">

  <div class="abs" style="left:0;right:0;top:840px;height:200px;background:linear-gradient(#15121c,rgba(21,18,28,0))"></div>
  <div class="abs" style="left:90px;top:300px;color:#fff">

    <div style="display:inline-block;margin-top:40px;background:#e5322d;font:900 58px 'Noto Sans KR';padding:12px 30px;border-radius:16px">주가 급락 이유 3가지</div>

<!-- ───────── 영상 스테이지 (renderAt(t)로 프레임 구성) ───────── -->
<div class="v" id="stage">
  <div id="bar"></div>

  <!-- S0 훅 (cover1과 같은 구도) -->
  <div class="layer gbg" id="hook">
    <div class="abs" style="left:90px;right:90px;top:210px;color:#fff">
      <div style="font:700 46px 'Noto Sans KR';color:#aab4c8">10.28 발표 · 알파벳 3분기</div>
      <div class="bh" style="font-size:150px;line-height:1.15;margin-top:18px">구글 <span style="color:#ff5a5a">실적발표</span></div>
      <div class="bh" style="font-size:112px;line-height:1.28;margin-top:56px">
        <div id="h1">클라우드 <span style="color:#5fa0ff">2배</span>인데</div>
        <div id="h2" style="transform-origin:0 50%">주가 <span class="redb">-10%</span>?</div>
      </div>
    </div>
    <div class="wmv">@NTL</div>
  </div>

  <!-- 그림 장면 공통 -->
  <div class="layer" id="figs">
    <div class="cap bh" id="cap"></div>
    <div class="figbox"><img id="fig"><div class="ring" id="ring"></div></div>
  </div>

  <!-- 반전 질문 -->
  <div class="layer" id="ask" style="background:#0d1a33">
    <div class="bh abs" style="left:0;right:0;top:700px;text-align:center;color:#fff;font-size:140px;line-height:1.25">
      그런데<br>빛난 <span style="color:#5fa0ff">하나</span><span id="q" style="display:inline-block;color:#ffc53d">!</span></div>
    <div class="wmv">@NTL</div>
  </div>

  <!-- 마무리 -->
  <div class="layer" id="outro" style="background:#0b0e16">
    <div class="abs" style="left:90px;right:90px;top:330px;color:#fff">
      <div style="font:700 56px 'Noto Sans KR';color:#aab4c8">다음 체크포인트</div>
      <div class="bh" id="o1" style="font-size:124px;line-height:1.22;margin-top:24px"><span style="color:#5fa0ff">클라우드</span> 성장이<br>계속될까?</div>
      <div id="o2" style="margin-top:56px;display:inline-block;background:#ffc53d;color:#111;font:900 58px 'Noto Sans KR';padding:18px 36px;border-radius:18px">👉 전체 숫자는 블로그에서</div>
      <div style="margin-top:50px;color:#7f8aa0;font:500 34px/1.5 'Noto Sans KR'">출처: 알파벳 3분기 실적·언론 보도(2026.10.29)<br>투자 권유가 아닌 정보 정리입니다</div>
    </div>
    <div class="wmv">@NTL</div>
  </div>

  <div class="sub"><span id="sub"></span></div>
</div>

<script>
const T = 38;            // 전체 길이(초)
const K = 900 / 1080;    // 그림 표시 배율
const cl = (x,a=0,b=1)=>Math.min(b,Math.max(a,x));
const ez = x=>{ x=cl(x); return x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2; };
const fin = (t,a,d=.3)=>ez((t-a)/d);
const win = (t,a,b,d=.3)=>Math.min(fin(t,a,d), 1-fin(t,b-d,d));

// 그림 장면: caps=[[시작,문구]], kf=[[초,배율,초점x,초점y]], rings=[[시작,끝,x,y,w,h]] (1080 그림 좌표), subs=[[시작,끝,자막]]
const FIGS = [
  { a:3, b:7.5, src:'fig2_price.png',
    caps:[[3,'실적 발표 직후<br><span class="r">주가 -10%</span>']],
    kf:[[3,1,540,540],[4,1,540,540],[5.2,1.2,640,560],[7.5,1.24,640,560]],
    rings:[[5.1,7.5,790,700,200,110]],
    subs:[[3,7.5,'실적 발표 직후<br>주가가 <b>10% 넘게</b> 빠졌습니다']] },
  { a:7.5, b:11.5, src:'fig1_score.png',
    caps:[[7.5,'성적표는<br><span class="r">7개 중 6개 미달</span>']],
    kf:[[7.5,1,540,540],[8.5,1,540,540],[9.6,1.12,540,560],[11.5,1.14,540,560]],
    rings:[[9.4,11.5,80,306,920,500]],
    subs:[[7.5,11.5,'성적표는 7개 중 <b>6개가 미달</b><br>이유는 세 가지입니다']] },
  { a:11.5, b:16.5, src:'fig3_eps.png',
    caps:[[11.5,'이유 ①<br><span class="r">이익이 예상의 70%</span>']],
    kf:[[11.5,1,540,540],[12.4,1,540,540],[13.6,1.15,560,560],[16.5,1.18,560,560]],
    rings:[[13.4,14.8,130,330,200,400],[14.8,16.5,850,430,160,300]],
    subs:[[11.5,14.2,'첫째, 이익이 <b>예상의 70%</b>'],[14.2,16.5,'지분 손실을 빼도<br><b>여전히 미달</b>']] },
  { a:16.5, b:22.5, src:'fig4_cash.png',
    caps:[[16.5,'이유 ②<br><span class="r">버는 것보다 더 쓴다</span>'],[20.6,'그런데<br><span class="y">내년엔 더 쓴다</span>']],
    kf:[[16.5,1,540,540],[17.3,1,540,540],[18.4,1.15,540,430],[20.4,1.15,540,430],[21.4,1.3,775,640],[22.5,1.33,775,640]],
    rings:[[18.2,19.4,80,320,450,207],[19.4,20.6,549,320,451,207],[21.2,22.5,549,545,451,188]],
    subs:[[16.5,19.4,'둘째, 설비투자가<br>1년 새 <b>두 배 넘게</b>'],[19.4,20.6,'현금흐름은 <b>마이너스</b>'],[20.6,22.5,'그런데 <b>내년엔 더 쓴답니다</b>']] },
  { a:22.5, b:27, src:'fig5_ads.png',
    caps:[[22.5,'이유 ③<br><span class="r">본업 광고도 미달</span>']],
    kf:[[22.5,1,540,540],[23.3,1,540,540],[24.4,1.15,520,520],[27,1.18,520,520]],
    rings:[[24.2,25.6,70,380,880,110],[25.6,27,70,580,780,110]],
    subs:[[22.5,27,'셋째, 본업인 <b>검색·유튜브 광고</b>도<br>예상에 못 미쳤습니다']] },
  { a:28.5, b:34, src:'fig6_cloud.png',
    caps:[[28.5,'구글 클라우드<br><span class="k">1년 새 +103%</span>']],
    kf:[[28.5,1,540,540],[29.4,1,540,540],[30.5,1.15,540,450],[31.6,1.15,540,450],[32.6,1.2,540,640],[34,1.22,540,640]],
    rings:[[30.3,31.8,80,320,920,213],[32.4,34,70,625,820,155]],
    subs:[[28.5,31.6,'바로 구글 클라우드<br>매출이 <b>1년 새 두 배</b>'],[31.6,34,'이익률도 <b>36%</b>로 뛰었습니다']] },
];
FIGS.forEach(f=>{ const i=new Image(); i.src=f.src; });

function camAt(kf,t){
  let i=0; while(i<kf.length-1 && t>kf[i+1][0]) i++;
  const A=kf[i], B=kf[Math.min(i+1,kf.length-1)];
  const p = B[0]>A[0] ? ez((t-A[0])/(B[0]-A[0])) : 0;
  return [1,2,3].map(j=>A[j]+(B[j]-A[j])*p);
}
function place(s,cx,cy){
  const k=K*s, size=1080*k;
  return {k, tx:cl(450-cx*k,900-size,0), ty:cl(450-cy*k,900-size,0)};
}
const $=id=>document.getElementById(id);

window.renderAt = function(t){
  $('bar').style.width = (cl(t/T)*1080)+'px';
  let sub='';

  // 훅 0~3
  $('hook').style.opacity = 1-fin(t,2.75,.25);
  $('h1').style.opacity = fin(t,.3,.25);
  const s2 = cl((t-1.2)/.35);
  $('h2').style.opacity = s2>0?1:0;
  $('h2').style.transform = `scale(${s2>0 ? 1+0.25*(1-ez(s2)) : 1})`;
  if (t<3) sub = t<1.2 ? '클라우드는 <b>두 배</b> 컸는데' : '주가는 <b>10% 급락</b>?';

  // 그림 장면 (이어지는 장면끼리는 레이어를 유지하고 그림만 새로 올린다)
  const f = FIGS.find(f=>t>=f.a && t<f.b) || FIGS.find(f=>t>=f.a-.3 && t<f.b+.3);
  if (f){
    const adjIn = FIGS.some(g=>g.b===f.a), adjOut = FIGS.some(g=>g.a===f.b);
    $('figs').style.opacity = Math.min(adjIn?1:fin(t,f.a), adjOut?1:1-fin(t,f.b-.3));
    if ($('fig').getAttribute('src')!==f.src) $('fig').setAttribute('src',f.src);
    const c = [...f.caps].reverse().find(c=>t>=c[0]) || f.caps[0];
    if ($('cap').innerHTML!==c[1]) $('cap').innerHTML=c[1];
    const cp = fin(t,c[0],.35);
    $('cap').style.opacity = cp; $('cap').style.transform = `translateY(${(1-cp)*40}px)`;
    const fp = fin(t,f.a,.45);
    $('fig').style.opacity = fp;
    const [s,cx,cy] = camAt(f.kf,t);
    const {k,tx,ty} = place(s,cx,cy);
    $('fig').style.transform = `translate(${tx}px,${ty+(1-fp)*120}px) scale(${k})`;
    const r = f.rings.find(r=>t>=r[0]-.25 && t<r[1]);
    const R = $('ring');
    R.style.opacity = r ? win(t,r[0],r[1],.25)*(0.75+0.25*Math.abs(Math.cos((t-r[0])*3))) : 0;
    if (r){ R.style.width=r[4]+'px'; R.style.height=r[5]+'px';
      R.style.transform = `translate(${tx+r[2]*k}px,${ty+r[3]*k+(1-fp)*120}px) scale(${k})`; }
    const sb = f.subs.find(x=>t>=x[0]&&t<x[1]); if (sb) sub=sb[2];
  } else $('figs').style.opacity = 0;

  // 반전 질문 27~28.5
  $('ask').style.opacity = win(t,27,28.5,.2);
  const qp = cl((t-27.3)/.4);
  $('q').style.transform = `scale(${1+0.7*Math.sin(qp*Math.PI)})`;
  if (t>=27 && t<28.5) sub = '';

  // 마무리 34~38
  $('outro').style.opacity = fin(t,34,.35);
  $('o1').style.opacity = fin(t,34.2,.4);
  const o2 = fin(t,35.4,.35);
  $('o2').style.opacity = o2; $('o2').style.transform = `translateY(${(1-o2)*40}px) scale(${1+0.04*Math.sin(Math.max(0,t-35.8)*4)})`;
  if (t>=34) sub = '';

  $('sub').parentNode.style.top = t<3 ? '880px' : '1470px';
  $('sub').innerHTML = sub; $('sub').style.display = sub?'inline-block':'none';
};
</script>
<script>document.querySelectorAll('.gbg').forEach(el=>el.insertAdjacentHTML('afterbegin',document.getElementById('gsvg').innerHTML));renderAt(0);</script>
<script src="../../tools/watermark.js"></script>
