<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../../tools/thumb_base.css"></head><body>

<template id="bg1svg">
<svg class="bg" viewBox="0 0 1080 1080">
  <rect width="1080" height="1080" fill="#ff5fa2"/>
  <g fill="#fff" fill-opacity=".18"><circle cx="120" cy="980" r="160"/><circle cx="1000" cy="120" r="140"/><circle cx="560" cy="60" r="40"/></g>
  <!-- 패밀리 통 + 스쿱 -->
  <g transform="translate(580,560)">
    <ellipse cx="200" cy="420" rx="250" ry="40" fill="#000" fill-opacity=".18"/>
    <path d="M0 120 L40 420 L360 420 L400 120 Z" fill="#fff"/>
    <rect x="-20" y="90" width="440" height="50" rx="20" fill="#5b3a29"/>
    <circle cx="80" cy="60" r="80" fill="#8b5a3c"/><circle cx="200" cy="30" r="90" fill="#fff3c4"/><circle cx="320" cy="60" r="80" fill="#9be3c3"/>
    <circle cx="140" cy="-60" r="75" fill="#ffb3d1"/><circle cx="270" cy="-60" r="75" fill="#c98bdb"/>
    <g fill="#5b3a29" fill-opacity=".5"><circle cx="190" cy="10" r="8"/><circle cx="225" cy="45" r="7"/><circle cx="300" cy="-70" r="7"/></g>
    <path d="M60 220 Q200 260 340 220" fill="none" stroke="#ff5fa2" stroke-width="18" stroke-linecap="round"/>
  </g>
</svg></template>

<template id="bg2svg">
<svg class="bg" viewBox="0 0 1080 1080">
  <rect width="1080" height="1080" fill="#fff4e8"/>
  <!-- 달력 -->
  <g transform="translate(720,80) rotate(6) scale(.75)">
    <rect width="380" height="360" rx="30" fill="#fff" stroke="#2b1a12" stroke-width="10"/>
    <rect width="380" height="90" rx="30" fill="#ff5fa2" stroke="#2b1a12" stroke-width="10"/>
    <g fill="#f1e6e0"><rect x="40" y="130" width="60" height="50" rx="8"/><rect x="125" y="130" width="60" height="50" rx="8"/><rect x="210" y="130" width="60" height="50" rx="8"/><rect x="295" y="130" width="50" height="50" rx="8"/>
    <rect x="40" y="205" width="60" height="50" rx="8"/><rect x="125" y="205" width="60" height="50" rx="8"/><rect x="295" y="205" width="50" height="50" rx="8"/><rect x="40" y="280" width="60" height="50" rx="8"/><rect x="125" y="280" width="60" height="50" rx="8"/></g>
    <circle cx="240" cy="230" r="46" fill="none" stroke="#ff5fa2" stroke-width="12"/>
  </g>
  <!-- 콘 -->
  <g transform="translate(760,700)">
    <path d="M-90 0 L0 330 L90 0 Z" fill="#e8b273" stroke="#2b1a12" stroke-width="8"/>
    <g stroke="#c48a4a" stroke-width="6"><line x1="-60" y1="40" x2="40" y2="160"/><line x1="0" y1="20" x2="70" y2="100"/><line x1="-40" y1="120" x2="20" y2="200"/></g>
    <circle cx="0" cy="-40" r="100" fill="#ffb3d1" stroke="#2b1a12" stroke-width="8"/>
  </g>
</svg></template>

<template id="bg3svg">
<svg class="bg" viewBox="0 0 1080 1080">
  <rect width="1080" height="1080" fill="#4a2e20"/>
  <g fill="#fff" fill-opacity=".06"><circle cx="900" cy="200" r="260"/></g>
  <g transform="translate(800,620)">
    <path d="M-100 120 L0 420 L100 120 Z" fill="#e8b273"/>
    <circle cx="0" cy="70" r="105" fill="#ff5fa2"/>
    <circle cx="0" cy="-90" r="100" fill="#fff3c4"/>
    <circle cx="0" cy="-240" r="95" fill="#8b5a3c"/>
    <circle cx="0" cy="-385" r="88" fill="#9be3c3"/>
    <g fill="#ffd400"><circle cx="-160" cy="-300" r="10"/><circle cx="170" cy="-180" r="12"/><circle cx="150" cy="-420" r="8"/><circle cx="-170" cy="-60" r="9"/></g>
  </g>
</svg></template>

<div class="canvas" data-out="bg1.png" id="b1"></div>
<div class="canvas" data-out="bg2.png" id="b2"></div>
<div class="canvas" data-out="bg3.png" id="b3"></div>

<div class="canvas" data-out="thumb1.png" id="t1">
  <div class="copy" style="top:120px;right:400px;color:#fff">
    <span class="tag" style="background:#2b1a12;color:#fff">베스킨라빈스 70%</span>
    <div class="headline" style="font-size:140px;margin-top:30px;white-space:nowrap;text-shadow:0 6px 0 #d4307a">패밀리<br><span style="color:#fff3c4">8,400원</span></div>
  </div>
  <div class="copy" style="top:640px;right:auto"><span class="tag" style="background:#fff;color:#e6006f;font-size:54px">오늘이 마지막!</span></div>
</div>

<div class="canvas" data-out="thumb2.png" id="t2" data-wm="dark">
  <div class="copy" style="top:150px;right:300px;color:#2b1a12">
    <div class="sub" style="font-size:52px;color:#e6006f">배라 쿠폰</div>
    <div class="headline" style="font-size:150px;margin-top:10px;white-space:nowrap"><span style="color:#ff5fa2">70%</span><br>놓쳤다면?</div>
  </div>
  <div class="copy" style="bottom:110px;right:auto"><span class="tag" style="background:#2b1a12;color:#fff3c4">이달 말까지 남은 할인 7가지</span></div>
</div>

<div class="canvas" data-out="thumb3.png" id="t3">
  <div class="copy" style="top:150px;right:380px;color:#fff">
    <div class="sub" style="font-size:52px;color:#ffb3d1">다음 배라 할인은</div>
    <div class="headline" style="font-size:150px;margin-top:10px;white-space:nowrap"><span style="color:#ff5fa2">31데이</span><br>미리 예약</div>
  </div>
  <div class="copy" style="bottom:110px;right:auto"><span class="tag" style="background:#fff3c4;color:#4a2e20">10.24~30 사전예약 시작</span></div>
</div>

<script>
const put=(id,tpl)=>document.getElementById(id).insertAdjacentHTML('afterbegin',document.getElementById(tpl).innerHTML);
put('b1','bg1svg');put('b2','bg2svg');put('b3','bg3svg');
put('t1','bg1svg');put('t2','bg2svg');put('t3','bg3svg');
</script>
<script src="../../tools/watermark.js"></script>
</body></html>
