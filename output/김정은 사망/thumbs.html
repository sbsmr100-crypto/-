<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../../tools/thumb_base.css"></head><body>

<template id="bg1svg">
<svg class="bg" viewBox="0 0 1080 1080">
  <defs><radialGradient id="r1" cx=".75" cy=".55" r=".7"><stop offset="0" stop-color="#4a0d14"/><stop offset="1" stop-color="#0d0a0b"/></radialGradient></defs>
  <rect width="1080" height="1080" fill="url(#r1)"/>
  <!-- 휴대폰 -->
  <g transform="translate(640,300) rotate(8)">
    <rect width="330" height="620" rx="46" fill="#1b1b1f" stroke="#444" stroke-width="8"/>
    <rect x="22" y="60" width="286" height="500" rx="18" fill="#26262c"/>
    <rect x="50" y="100" width="230" height="70" rx="16" fill="#e63946"/>
    <rect x="50" y="190" width="200" height="60" rx="16" fill="#3a3a44"/>
    <rect x="50" y="270" width="230" height="60" rx="16" fill="#3a3a44"/>
    <rect x="50" y="350" width="170" height="60" rx="16" fill="#e63946" fill-opacity=".7"/>
    <rect x="50" y="430" width="220" height="60" rx="16" fill="#3a3a44"/>
  </g>
  <!-- 말풍선 -->
  <g fill="#ffffff" fill-opacity=".08"><ellipse cx="560" cy="200" rx="120" ry="60"/><ellipse cx="980" cy="200" rx="90" ry="46"/><ellipse cx="560" cy="960" rx="150" ry="60"/></g>
  <g font-family="Noto Sans KR" font-weight="900" fill="#e63946" fill-opacity=".85"><text x="900" y="290" font-size="90">!</text><text x="590" y="560" font-size="70" fill="#fff" fill-opacity=".3">?</text></g>
</svg></template>

<template id="bg2svg">
<svg class="bg" viewBox="0 0 1080 1080">
  <rect width="1080" height="1080" fill="#f3f1ec"/>
  <g stroke="#d8d3c8" stroke-width="3"><line x1="0" y1="120" x2="1080" y2="120"/><line x1="0" y1="960" x2="1080" y2="960"/></g>
  <!-- 신문 조각 -->
  <g transform="translate(560,560) rotate(-6)">
    <rect width="420" height="360" rx="10" fill="#fff" stroke="#bbb" stroke-width="4"/>
    <rect x="30" y="30" width="360" height="40" fill="#ccc"/>
    <g fill="#e2e2e2"><rect x="30" y="100" width="360" height="18"/><rect x="30" y="135" width="320" height="18"/><rect x="30" y="170" width="350" height="18"/><rect x="30" y="205" width="300" height="18"/><rect x="30" y="240" width="340" height="18"/><rect x="30" y="275" width="260" height="18"/></g>
  </g>
  <!-- 돋보기 -->
  <g transform="translate(700,400)">
    <circle r="150" fill="#fff" fill-opacity=".55" stroke="#111" stroke-width="26"/>
    <rect x="95" y="95" width="60" height="200" rx="26" fill="#111" transform="rotate(-45 95 95)"/>
    <text x="0" y="55" text-anchor="middle" font-size="170" font-weight="900" fill="#e63946" font-family="Noto Sans KR">?</text>
  </g>
</svg></template>

<template id="bg3svg">
<svg class="bg" viewBox="0 0 1080 1080">
  <rect width="1080" height="1080" fill="#0c1a30"/>
  <polygon points="760,0 980,0 1080,1080 520,1080" fill="#ffd400" fill-opacity=".07"/>
  <!-- 달력 넘김 -->
  <g transform="translate(640,520)">
    <rect x="40" y="-40" width="320" height="300" rx="24" fill="#22385e"/>
    <rect x="20" y="-20" width="320" height="300" rx="24" fill="#2e4a7a"/>
    <rect width="320" height="300" rx="24" fill="#fff"/>
    <rect width="320" height="80" rx="24" fill="#e63946"/><rect y="56" width="320" height="24" fill="#e63946"/>
    <text x="160" y="230" text-anchor="middle" font-size="140" font-weight="900" fill="#111" font-family="Black Han Sans,Noto Sans KR">20</text>
  </g>
  <g fill="#fff" fill-opacity=".5"><circle cx="120" cy="150" r="3"/><circle cx="300" cy="90" r="2"/><circle cx="980" cy="120" r="3"/><circle cx="880" cy="260" r="2"/><circle cx="520" cy="60" r="2"/></g>
</svg></template>

<div class="canvas" data-out="bg1.png" id="b1"></div>
<div class="canvas" data-out="bg2.png" id="b2"></div>
<div class="canvas" data-out="bg3.png" id="b3"></div>

<div class="canvas" data-out="thumb1.png" id="t1">
  <div class="copy" style="top:180px;right:440px;color:#fff">
    <div class="sub" style="font-size:54px;color:#ff8787">김정은</div>
    <div class="headline" style="font-size:160px;margin-top:10px">또<br><span style="color:#e63946">사망설</span></div>
    <div class="sub" style="margin-top:34px;display:inline-block;background:#fff;color:#111;padding:10px 20px;border-radius:12px;white-space:nowrap">북한은 사진으로 반박</div>
  </div>
</div>

<div class="canvas" data-out="thumb2.png" id="t2" data-wm="dark">
  <div class="copy" style="top:170px;right:420px;color:#111">
    <span class="tag" style="background:#111;color:#fff">팩트체크</span>
    <div class="headline" style="font-size:140px;margin-top:30px">사망설<br><span class="hl" style="background:#e63946;color:#fff">진짜일까?</span></div>
  </div>
  <div class="copy" style="bottom:100px;right:auto"><span class="tag" style="background:#ffd400;color:#111">확인된 사실만 정리</span></div>
</div>

<div class="canvas" data-out="thumb3.png" id="t3">
  <div class="copy" style="top:170px;color:#fff">
    <div class="sub" style="font-size:54px;color:#9db4ff">2020년 김정은 사망설</div>
    <div class="headline" style="font-size:150px;margin-top:10px"><span style="color:#ffd400">20일</span> 만에<br>나타났다</div>
  </div>
  <div class="copy" style="bottom:110px;right:auto"><span class="tag" style="background:#e63946;color:#fff">이번엔?</span></div>
</div>

<script>
const put=(id,tpl)=>document.getElementById(id).insertAdjacentHTML('afterbegin',document.getElementById(tpl).innerHTML);
put('b1','bg1svg');put('b2','bg2svg');put('b3','bg3svg');
put('t1','bg1svg');put('t2','bg2svg');put('t3','bg3svg');
</script>
<script src="../../tools/watermark.js"></script>
</body></html>
